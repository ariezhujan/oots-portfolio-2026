<!doctype html>
<html lang="id" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			try {
				var d = document.documentElement;
				if (localStorage.getItem('theme') === 'light') d.classList.remove('dark');
				// layar muat hanya sekali per sesi dan dilewati jika pengguna mengurangi animasi
				if (sessionStorage.getItem('loaded') || matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('no-loader');
			} catch (e) {}
		</script>
		<noscript><style>.loader { display: none !important; }</style></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
